は、意味・分類・同義・対象の選択、事実の追加・更新・削除・何もしない（ADD・UPDATE・DELETE・NOOP）の選択、会話から事実を取り出すこと、エージェントの発言を記憶対象として同じ重みで扱うこと、コードの照合の判断が含まれる。記憶システムは、自動の操作ではなく確認つきの計画として扱われる対象とされる。読み出しでは、追加のLLM呼び出しなしで質問の意図を分類する。明示的操作はLLMを呼ばない。mem0の旧方式では記憶を書き換えていた。書込み時に誤って記憶を消すことがあったが、アーキテクチャ転換後にその誤りはなくなった。旧方式では古い住所の記憶を更新または削除していた。更新処理では、旧方式では抽出と操作の判断で2段、新方式では1回で済む。"},{"id":"n6","label":"host","names":["host","eumenes-memory-host 0.1.0","Eumenes の host","vendor/eumenes-memory-host/","host 0.1.0"],"types":["別パッケージ（CLI・MCP）","パッケージ","意味の判断を持つ主体","実装の主体","記憶管理を行う主体","対象","ベンダーパッケージディレクトリ","主体・実行主体","役割・主体","主体・機構"],"m":12,"docs":[0,2],"summary":null},{"id":"n7","label":"記憶","names":["記憶"],"types":["データ","出典・派生物","記憶","概念","システムが保持する情報","記憶データ","システムの機能"],"m":8,"docs":[0,1,2],"summary":"記憶とは、忘却が届けられる対象の一つであり、新しい記憶と既存の記憶からなり、host の計画の対象となる。時とともに溜まるものとして位置づけられる。新方式では書込みの前に似た記憶を10件取り込む。内容の種類として、予定・状態・出来事・関係・好み・不在がある。全体として送信全体を構成する記憶の総体であり、数百件を超えると想起ができなくなる。稼働中の実際の記憶は0件であるとされる。意味検索で取れなかったものを実体を辿って見つけることはできない。"},{"id":"n8","label":"update","names":["update","delete","明示の `update`・`delete`・`delete_all`"],"types":["明示的操作","明示的な操作コマンド","mem0 の訂正方法","mem0 の忘却方法","操作"],"m":7,"docs":[0,1],"summary":null},{"id":"n9","label":"時間推論","names":["時間推論","3 つの信号の融合、時間推論、減衰の仕組み"],"types":["機能","概念・タスク","mem0 の技術的内容","評価条件","機能・概念"],"m":7,"docs":[1],"summary":null},{"id":"n10","label":"LongMemEval","names":["LongMemEval"],"types":["公開ベンチマーク","評価（ベンチマーク）","ベンチマーク","評価手法・ベンチマーク","評価手法・ベンチマーク（旧アルゴリズムの値）","評価手法・指標"],"m":6,"docs":[0,1,2],"summary":"LongMemEvalは、公開ベンチマークの一つ。知識の更新、時間の推論、複数のセッションを測る対象として挙げられる。時間推論を足した後の評価では、時間推論の分類が93.2から97.0に上がった一方、知識の更新は96.2から93.6に下がった。小さなベンチマークの一例として挙げられ、LoCoMoと同様に、方法を変えると記憶の仕組みが良くなら点が上がるとmem0が注意している。新しい値が93.4・94.4・94.8に分かれる。これは取得件数（top_200とtop_50）の違いと時間推論の前後の違いが混ざっている。旧アルゴリズムの値として、ブログの表では67.8。"},{"id":"n11","label":"tgz","names":["tgz"],"types":["配布ファイル形式","配布パッケージ","配布パッケージ形式","圧縮ファイル","配布物"],"m":6,"docs":[0,2,3],"summary":"tgzはeumenes_memoryの配布形式（パッケージ形式）である。同じ版番号でも中身の違うものが複数存在するとされている。なお、配布物のパッケージ形式として、同じ版番号のtgzは1つだけにするよう、評価の側で指摘されている。"},{"id":"n12","label":"state key","names":["state key"],"types":["mem0 の時間管理の要素","mem0 の Platform に追加された鍵","続いている状態に付けるキー","状態を表すキー","Platformの要素"],"m":5,"docs":[0,1,3],"summary":"state key とは、mem0 が Platform に追加したキーであり、Platform 側からも施策4として追加された要素である。mem0 が Platform に付けた state key について、同じ鍵（key）の新しい状態が来ると、その古い状態が自動的に終わらされる仕組みとして説明されている。具体的には、続いている状態（進行中の状態）に付けられるキーで、新しい同じ key の状態が入ってくると、古い状態の終了時刻が自動で入力される。Platform 側からは、古い状態を終わらせるのに使うキー、および Platform の時間推論で続いている状態に付けられるキーとして説明されている。"},{"id":"n13","label":"eumenes_knowledge","names":["eumenes_knowledge"],"types":["知識システム","制度・仕組み","記憶・知識機構","検索システムまたは手法"],"m":5,"docs":[2,3],"summary":null},{"id":"n14","label":"memory-benchmarks","names":["memory-benchmarks"],"types":["評価の枠組み","ベンチマーク","ツール・リソース"],"m":5,"docs":[1,2],"summary":"memory-benchmarks（mem0 に関するベンチマーク）は、mem0 の評価に用いられる公開された枠組みである。mem0 の OSS と並べるために使用される。Apache-2.0 ライセンス。mem0 に関するベンチマークを提供するリポジトリとしても機能する。既定の回答・採点モデルは gpt-4o です。ただし、実際に動かした再現が確かめていないことが挙げられています。"},{"id":"n15","label":"忘却","names":["忘却"],"types":["不可逆の操作","機能・プロセス","記憶システムの特徴","操作・処理","処理・操作"],"m":5,"docs":[0,1],"summary":"忘却は、Eumenesシステムにおける記憶の削除を担う機能である。訂正と忘却の語彙が持つ不可逆の忘却であり、停止と名前で区別されている。2相で構成される。弱点として、台帳の速さではなく、想起の入力の量の弱さが挙げられる。利用者が消してほしいと言われたときに行う必要のある操作であり、アプリケーションが明示的に操作する必要がある。新では訂正と忘却の設計がアプリケーションの責任になる。"},{"id":"n16","label":"新方式","names":["新方式"],"types":["書込み方式","記憶管理の新方式","記憶管理の方式","記憶の保存方式"],"m":5,"docs":[0,1],"summary":null},{"id":"n17","label":"移行文書","names":["移行文書"],"types":["文書","文書の種類","検証に用いた資料"],"m":5,"docs":[1,3],"summary":"「移行文書」は、API の変更（OSS v2 から v3 への破壊的変更）を列挙・記述する文書である。変更の意味や内容が記されており、移行に関する文書としても位置づけられる。複数の説明では、その変更が確かな根拠として扱われる、変更の確認の出典として言及される、mem0 の側の事実の根拠として用いた資料である、とされ、根拠資料として機能することが示されている。"},{"id":"n18","label":"BEAM","names":["BEAM"],"types":["評価・分類の名称","ベンチマーク","分類（記憶システムの評価分類）","評価手法・指標"],"m":4,"docs":[1,2],"summary":"BEAM は、記憶における矛盾の解決を測る対象として挙げられている。mem0 の矛盾の解決が属する最も弱い分類とされる。BEAM の矛盾の解決度は 35.7（1M token）とされる。100 万 token と 1,000 万 token の会話を使うベンチマークである。小さなベンチマークが方法で点が上がるため、重視すべき対象として挙げられている。矛盾の解決が 35.7（1M token）と 32.5（10M token）で、公開された分類の中で最も低い値となった。"},{"id":"n19","label":"journal","names":["journal"],"types":["忘却の依存閉包と併置される仕組み","データ構造・記憶媒体","要素","設計要素"],"m":4,"docs":[0,2],"summary":"journalは、忘却の依存閉包とセットでeumenes_memoryが持つ、コードで決められる契約の一つである。ホストが忘却内容を追記する記憶媒体として機能する。鍵なしのhashの鎖によって構成され、偶然の破損だけを検出する。悪意ある書換えを防ぐのはホストの責任とされる。eumenes_memoryが保つものの一つであり、忘却の依存閉包と併せて言及される。"},{"id":"n20","label":"出典","names":["出典"],"types":["出典・派生物","参照元文献または資料","データ","概念 / メタデータ"],"m":4,"docs":[0,2],"summary":null},{"id":"n21","label":"削除","names":["削除"],"types":["mem0 が残す課題","記憶の削除処理（DELETE）","記憶の削除処理","課題"],"m":4,"docs":[0,1],"summary":"削除は、mem0 が「State of AI Agent Memory 2026」で残る課題として挙げているものの一つである。eumenes_memory はこの部分を厚く作った。旧方式では LLM が選んでいた処理の一つであった一方、新方式では実行されない処理でもある。"},{"id":"n22","label":"型付きの関係","names":["型付きの関係"],"types":["グラフの辺","グラフ記憶が付けない関係","関係の形式","mem0が手放した要素"],"m":4,"docs":[1,3],"summary":"「型付きの関係」について、複数の説明が存在する。mem0 のアーキテクチャ転換により、OSS の応答からも Platform の応答からも消えたとされる。また、グラフ記憶は型付きの関係は付けないとされる。Platform の graphs 記憶が返さない関係の形式であるとされる。mem0 が手放したものの 1 つであるとされる。eumenes_memory では強み、あるいは別のパッケージの領分とされる。"},{"id":"n23","label":"索引","names":["索引"],"types":["実体の索引","派生物・データ","全文検索用のデータ構造","物（システム要素）"],"m":4,"docs":[1,2],"summary":"索引とは、ベクトルストアが持つ実体の索引である。hostとEumenesのどちらに持つかは判断対象であり、推奨はhostに持つことである。本体（eumenes-memory）に戻さず、hostかEumenesの派生物として持つ。記憶の写しであり、忘却の依存閉包に入れる。方式Bで増える派生物であり、言い取りこぼすおがあると懸念される。"},{"id":"n24","label":"CAS","names":["CAS"],"types":["書込みの競合検出方式","コードが決定する事項","競合検出を行う書込み方式","誤った削除を抑制する仕組み"],"m":4,"docs":[0],"summary":null},{"id":"n25","label":"Neo4j","names":["Neo4j"],"types":["グラフデータベース","グラフデータベースのdriver","データベース"],"m":4,"docs":[1],"summary":null},{"id":"n26","label":"Python v2.0.0","names":["Python v2.0.0"],"types":["SDKのバージョン","Python SDK の版","ソフトウェアのバージョン","mem0 Python のリリースノート"],"m":4,"docs":[1],"summary":null},{"id":"n27","label":"1,001 件","names":["1,001 件","合成の 1,001 件"],"types":["合成データの件数","数量・上限"],"m":3,"docs":[0,2,3],"summary":"「合成の1,001件」（1,001件とも呼ばれる）は、検証で用いられた合成の記憶の件数であり、E2で自然文の想起に使用された合成データの件数である。評価の側では、全件を渡す方式では合成の1,001件では上限を超えると指摘されている。"},{"id":"n28","label":"合成データ","names":["合成データ"],"types":["評価データ","評価に使用されるデータ","評価の側が使用するデータ"],"m":3,"docs":[0,2,3],"summary":null},{"id":"n29","label":"BM25","names":["BM25"],"types":["取り出しの手法","キーワード検索の手法","検索方式"],"m":3,"docs":[0,1],"summary":"BM25は、mem0の取り出し（検索）で意味（ベクトル）検索と実体（エンティティ）検索を融合させる手法の一つである。キーワードの採点（スコアリング）に用いられる。順位の加点にとどまり、候補の数を増やさない。"},{"id":"n30","label":"LoCoMo","names":["LoCoMo"],"types":["公開ベンチマーク","ベンチマーク","評価手法・ベンチマーク"],"m":3,"docs":[0,1],"summary":"LoCoMoは、公開ベンチマークの一つであり、小さなベンチマークの一例である。mem0は、取得を広げる・文脈を長くする・強いモデルを使うといった方法で点が上がると注意している対象である。LoCoMoのスコアについて、ブログの表では71.4、時間推論の記事では86.1や91.6、2025年の論文では66.88と、値が異なる。"},{"id":"n31","label":"World","names":["World","別リポジトリの World"],"types":["概念・仕組みの名前","派生物","世界"],"m":3,"docs":[0,2],"summary":null},{"id":"n32","label":"commit","names":["commit"],"types":["バージョン管理の単位","バージョン管理の変更単位"],"m":3,"docs":[0,2],"summary":"「commit」について、複数の説明が与えられている。1つ目の説明では、どのtgzがどのcommitから作られたかを版番号だけでは追えないとされる。2つ目の説明では、配布物はcleanなcommitからだけ作られるとされる。3つ目の説明では、cleanなcommitからの配布とverify:packageで一致が確認される単位とされる。これらはすべてcommitという実体に関連する説明である。"},{"id":"n33","label":"mem0 のアーキテクチャ転換が何をもたらすか","names":["mem0 のアーキテクチャ転換が何をもたらすか"],"types":["調査記事（Claude のアーティファクト）","Claude のアーティファクト（Web ページ）","文書（リンク）"],"m":3,"docs":[0,3],"summary":null},{"id":"n34","label":"verify:package","names":["verify:package"],"types":["検証コマンド","CIの試験コマンド"],"m":3,"docs":[0,2],"summary":"verify:package は、CI（継続的統合）で実行される試験コマンドの一つである。manifest（マニフェスト）の commit と配布物が一致することを確かめるために使われる。具体的には、manifest の commit と一致するかどうかを検証するものである。"},{"id":"n35","label":"ベンチマークの数値","names":["ベンチマークの数値"],"types":["指標","mem0 の性能評価の数値"],"m":3,"docs":[1,3],"summary":"「ベンチマークの数値」とは、mem0 が自社の Platform で測定したベンチマークの結果の数値である。mem0 自身の測定によるもの。ページによって値が食い違う。回答と採点に使ったモデルも書かれていない。方向の目安としてだけ用いられ、事実の確定には用いない。"},{"id":"n36","label":"利用者","names":["利用者"],"types":["ユーザー","人物","人物（判断を行う主体）"],"m":3,"docs":[1,2],"summary":null},{"id":"n37","label":"外部のグラフ DB","names":["外部のグラフ DB","グラフ DB"],"types":["外部データベース","グラフデータベース","データベース"],"m":3,"docs":[1,2],"summary":null},{"id":"n38","label":"時間","names":["時間"],"types":["記憶のカテゴリ","概念","概念・軸"],"m":3,"docs":[0,1],"summary":"「時間」は、精度つきの成立期間を保存するカテゴリである。今有効かどうかはホストが判定する。mem0 のアーキテクチャ転換により、Platform だけに扱われるようになる。旧来の仕様には時間は存在せず、新仕様では Platform だけに時間推論と減衰がある。"},{"id":"n39","label":"版","names":["版"],"types":["コードが決定する事項","eumenes_memory が持つもの","出典の情報"],"m":3,"docs":[0,2],"summary":"「版」について、複数の説明が与えられている。1つには、語句で分岐する処理は足さないと明記されており、コードが決定する事項の一つである、とある。別には、eumenes_memory が持っているものの一つである、とある。さらに別には、knowledge の根拠の一つであり、版はバージョンである、とある。これらはすべて「版」がバージョンを意味するものであることを示している。"},{"id":"n40","label":"知識の更新","names":["知識の更新"],"types":["概念・処理","概念・タスク","機能"],"m":3,"docs":[1,2],"summary":"「知識の更新」は、mem0 が加算型の構造においていちばん難しい分類であると自身も認めている分類である。mem0 はこの加算型の構造においていちばん難しい分類のままとされており、LongMemEval では 96.2 から 93.6 に下がった。これは mem0 が最も弱い分類に属する機能の一つである。"},{"id":"n41","label":"約 7,000 token","names":["約 7,000 token","7,000 token","約7,000 token"],"types":["mem0 の取り出し量","mem0 が 1 回で答えるトークン数","取り出しの収容量"],"m":3,"docs":[0,2],"summary":"「約 7,000 token」（7,000 token、約7,000 token と表記される）は、mem0 が取り出しを 1 回に行う際のトークン数である。mem0 の取り出しは 1 回あたり収めるトークン数が約 7,000 である。一方、eumenes_memory は全件を送るため、記憶が増えるほど不利になる。"},{"id":"n42","label":"関係","names":["関係"],"types":["記憶機能の構成要素の一つ","データ構造・概念","検索の経路"],"m":3,"docs":[1,2],"summary":"「関係」は、mem0 の記憶機能の構成要素の一つである。その内容については記述に食い違いがあり、一方の記述では「旧はMem0gの型付き関係、新は実体による順位の加点だけ」と説明される。もう一方の記述では、eumenes_knowledge の検索が RRF（Reciprocal Rank Fusion）で融合される4つの経路の一つである、とされる。"},{"id":"n43","label":"2025 年の論文","names":["2025 年の論文"],"types":["学術論文","論文"],"m":3,"docs":[1],"summary":null},{"id":"n44","label":"Mem0g","names":["Mem0g"],"types":["Mem0のグラフ版","Mem0 の旧バージョンの型付き関係を持つ構成要素","Mem0 の一種"],"m":3,"docs":[1],"summary":null},{"id":"n45","label":"mem0 のブログ","names":["mem0 のブログ"],"types":["ブログ","根拠となる資料"],"m":3,"docs":[1],"summary":null},{" <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
	(() => {
		const D = JSON.parse(document.getElementById("kg-data").textContent);
		const $ = (id) => document.getElementById(id);
		const esc = (s) =>
			String(s).replace(
				/[&<>"']/g,
				(c) =>
					({
						"&": "&amp;",
						"<": "&lt;",
						">": "&gt;",
						'"': "&quot;",
						"'": "&#39;",
					})[c],
			);
		const fmt = (n) => Number(n).toLocaleString("ja-JP");
		const pct = (x) =>
			x === null || x === undefined ? "—" : `${Math.round(x * 100)}%`;
		const docTitle = (i) => D.documents[i]?.title ?? "?";
		// Relation names are free text, so the API's edges (one per node pair, direction, relation name,
		// negation and certainty) rarely repeat. The picture draws one line per node pair instead and
		// lists the relations themselves in the inspector. Relations inside one node are not drawn.
		const pairs = new Map();
		for (const e of D.edges) {
			if (e.s === e.t) continue;
			const [a, b] = e.s < e.t ? [e.s, e.t] : [e.t, e.s];
			const key = `${a}|${b}`;
			let p = pairs.get(key);
			if (!p)
				pairs.set(key, (p = { id: key, s: a, t: b, m: 0, docs: new Set() }));
			p.m += e.m;
			for (const d of e.docs) p.docs.add(d);
		}
		const P = [...pairs.values()].map((p) => ({ ...p, docs: [...p.docs] }));

		// --- header ---------------------------------------------------------------
		const r = D.run;
		const how = r.relinked
			? `前の実行の抽出をそのまま使い、同一視だけを ${r.llm}（LARM の profile ${r.profile}、同一視の指示 v${r.linkVersion}）でやり直して`
			: `${r.llm}（LARM の profile ${r.profile}）で取り込み`;
		$("lede").textContent =
			`合成の調査 ${D.documents.length} 文書を、${how}、eumenes_knowledge のグラフ API から取り出したもの。手で描いた図ではなく、抽出と同一視の結果そのものです。${r.date} の 1 回の実行で、品質の基準値ではありません。`;
		const facts = [
			["文書", fmt(D.documents.length), `${fmt(r.bytes)} bytes`],
			["断片", fmt(r.fragments), `抽出の失敗 ${fmt(r.extractionsFailed)}`],
			["言及", fmt(r.entityMentions), `関係 ${fmt(r.relationMentions)}`],
			[
				"同一視の判断",
				fmt(r.linksSame + r.linksDifferent + r.linksUnsure),
				`same ${fmt(r.linksSame)} · different ${fmt(r.linksDifferent)} · unsure ${fmt(r.linksUnsure)}`,
			],
			[
				"ノード",
				fmt(D.nodes.length),
				`文書をまたぐもの ${fmt(D.nodes.filter((n) => n.docs.length > 1).length)}`,
			],
			[
				"関係",
				fmt(D.edges.length),
				`ノードの組 ${fmt(P.length)} · 2 文書以上で出る組 ${fmt(P.filter((p) => p.docs.length > 1).length)}`,
			],
			[
				"根拠の確認",
				`${fmt(r.evidenceValid)}/${fmt(r.evidenceTotal)}`,
				"根拠 API で valid",
			],
			["実行時間", `${r.minutes} 分`, `モデル呼出し ${fmt(r.calls)} 回`],
		];
		$("facts").innerHTML = facts
			.map(
				([k, v, s]) =>
					`<div class="fact"><span class="label">${esc(k)}</span><span class="value">${esc(v)}</span><span class="sub">${esc(s)}</span></div>`,
			)
			.join("");
		const reasonText = {
			linking_conflict: "矛盾する same を使わなかった",
			linking_unsure: "モデルが判断できなかった組がある",
			linking_pending: "同一視が終わっていない文書がある",
			extraction_incomplete: "抽出に失敗した断片がある",
			nodes_truncated: "ノードを上限で切った",
			edges_truncated: "辺を上限で切った",
		};
		$("reasons").innerHTML = D.partialReasons
			.map(
				(p) =>
					`<span class="reason">${esc(reasonText[p] ?? p)} <code>${esc(p)}</code></span>`,
			)
			.join("");

		// --- graph ----------------------------------------------------------------
		const svg = d3.select("#svg");
		const root = svg.append("g");
		const gEdges = root.append("g");
		const gNodes = root.append("g");
		const gLabels = root.append("g");
		const zoom = d3
			.zoom()
			.scaleExtent([0.2, 6])
			.on("zoom", (ev) => root.attr("transform", ev.transform));
		svg.call(zoom);
		const ramp = ["--d1", "--d2", "--d3", "--d4"];
		const fill = (n) => `var(${ramp[Math.min(n.docs.length, 4) - 1]})`;
		const radius = (n) => 3.5 + Math.sqrt(n.m) * 2.4;
		$("legend").innerHTML =
			"現れる文書の数 " +
			[1, 2, 3, 4]
				.map(
					(k) =>
						`<span><span class="swatch" style="background:var(${ramp[k - 1]})"></span>${k}</span>`,
				)
				.join("") +
			` <span>· 大きさ＝言及の数 · 線＝関係のあるノードの組（太さ＝関係の言及数、濃い線＝2 文書以上で出る組）</span>`;
		D.documents.forEach((d, i) => {
			const o = document.createElement("option");
			o.value = String(i);
			o.textContent = d.title;

		});

		const byId = new Map(D.nodes.map((n) => [n.id, n]));
		let selected = null;
		let current = { nodes: [], edges: [] };
		let fitK = 1;

		function filtered() {
			const minm = Number($("minm").value);
			const doc = $("doc").value === "" ? null : Number($("doc").value);
			const cross = $("cross").checked;
			let nodes = D.nodes.filter(
				(n) =>
					n.m >= minm &&
					(!cross || n.docs.length > 1) &&
					(doc === null || n.docs.includes(doc)),
			);
			const keep = new Set(nodes.map((n) => n.id));
			const edges = P.filter(
				(e) =>
					keep.has(e.s) &&
					keep.has(e.t) &&
					(doc === null || e.docs.includes(doc)),
			);
			if ($("iso").checked) {
				const linked = new Set(edges.flatMap((e) => [e.s, e.t]));
				nodes = nodes.filter((n) => linked.has(n.id) || n.id === selected);
			}
			return { nodes, edges };
		}

		function draw() {
			const { nodes, edges } = filtered();
			const box = $("canvas").getBoundingClientRect();
			const w = Math.max(box.width, 320),
				h = Math.max(box.height, 320);
			const simNodes = nodes.map((n) => ({ ...n }));
			const simIndex = new Map(simNodes.map((n) => [n.id, n]));
			const simEdges = edges.map((e) => ({
				...e,
				source: simIndex.get(e.s),
				target: simIndex.get(e.t),
			}));
			const sim = d3
				.forceSimulation(simNodes)
				.force("link", d3.forceLink(simEdges).distance(95).strength(0.25))
				.force("charge", d3.forceManyBody().strength(-260).distanceMax(600))
				.force(
					"collide",
					d3.forceCollide().radius((n) => radius(n) + 8),
				)
				.force("x", d3.forceX(0).strength(0.04))
				.force("y", d3.forceY(0).strength(0.06))
				.stop();
			// Settled before the first frame: the page is complete at rest, no animation.
			for (let i = 0; i < 400; i++) sim.tick();
			current = { nodes: simNodes, edges: simEdges };
			$("shown").textContent =
				`表示 ${fmt(simNodes.length)} ノード · ${fmt(simEdges.length)} 組`;

			gEdges
				.selectAll("line")
				.data(simEdges, (e) => e.id)
				.join("line")
				.attr("x1", (e) => e.source.x)
				.attr("y1", (e) => e.source.y)
				.attr("x2", (e) => e.target.x)
				.attr("y2", (e) => e.target.y)
				.attr("stroke", (e) =>
					e.docs.length > 1 ? "var(--edge-cross)" : "var(--edge)",
				)
				.attr("stroke-width", (e) => 1 + Math.log2(e.m));
			gNodes
				.selectAll("circle")
				.data(simNodes, (n) => n.id)
				.join("circle")
				.attr("cx", (n) => n.x)
				.attr("cy", (n) => n.y)
				.attr("r", radius)
				.attr("fill", fill)
				.attr("stroke", "var(--surface)")
				.attr("stroke-width", 2)
				.attr("tabindex", 0)
				.attr("role", "button")
				.attr(
					"aria-label",
					(n) => `${n.label}、言及 ${n.m}、文書 ${n.docs.length}`,
				)
				.style("cursor", "pointer")
				.on("click", (ev, n) => select(n.id))
				.on("keydown", (ev, n) => {
					if (ev.key === "Enter" || ev.key === " ") {
						ev.preventDefault();
						select(n.id);
					}
				})
				.on("mouseenter", (ev, n) => tip(ev, n))
				.on("mousemove", (ev, n) => tip(ev, n))
				.on("mouseleave", () => ($("tip").hidden = true));
			// Fit the settled layout into the canvas (the legend strip at the bottom stays clear).
			const xs = simNodes.map((n) => n.x),
				ys = simNodes.map((n) => n.y);
			if (simNodes.length) {
				const x0 = Math.min(...xs) - 20,
					x1 = Math.max(...xs) + 90,
					y0 = Math.min(...ys) - 20,
					y1 = Math.max(...ys) + 20;
				const k = Math.min(2, (w - 24) / (x1 - x0), (h - 70) / (y1 - y0));
				fitK = k;
				svg.call(
					zoom.transform,
					d3.zoomIdentity
						.translate(
							(w - (x1 - x0) * k) / 2 - x0 * k,
							(h - 50 - (y1 - y0) * k) / 2 - y0 * k,
						)
						.scale(k),
				);
			}
			labels();
			emphasize();
		}
		// Labels go to the nodes with the most mentions first, and a label that would overlap one already
		// placed is left out (its node still shows its name on hover and in the inspector).
		function labels() {
			const near = new Set(selected ? [selected] : []);
			if (selected)
				for (const e of current.edges) {
					if (e.s === selected) near.add(e.t);
					if (e.t === selected) near.add(e.s);
				}
			const order = [...current.nodes].sort(
				(a, b) =>
					near.has(b.id) - near.has(a.id) ||
					b.m - a.m ||
					b.docs.length - a.docs.length,
			);
			const placed = [];
			// Labels keep 12px on screen at the fitted zoom, so their boxes are measured at that scale.
			const f = 1 / fitK;
			const width = (t) =>
				[...t].reduce((s, c) => s + (c.charCodeAt(0) > 0x2e7f ? 12 : 7), 0) * f;
			const top = new Set(order.slice(0, 10).map((n) => n.id));
			const shown = [];
			for (const n of order) {
				if (!near.has(n.id) && shown.length >= 40) break;
				const t = clip(n.label, 20);
				const b = {
					x0: n.x + radius(n) + 2 * f,
					y0: n.y - 8 * f,
					x1: n.x + radius(n) + 4 * f + width(t),
					y1: n.y + 8 * f,
				};
				const hitsLabel = placed.some(
					(p) => b.x0 < p.x1 && p.x0 < b.x1 && b.y0 < p.y1 && p.y0 < b.y1,
				);
				// The ten nodes with the most mentions are labelled even over a neighbouring node.
				const hitsNode =
					!top.has(n.id) &&
					current.nodes.some(
						(o) =>
							o !== n &&
							o.x + radius(o) > b.x0 &&
							o.x - radius(o) < b.x1 &&
							o.y + radius(o) > b.y0 &&
							o.y - radius(o) < b.y1,
					);
				if (n.id !== selected && (hitsLabel || hitsNode)) continue;
				placed.push(b);
				shown.push({ n, t });
			}
			gLabels
				.selectAll("text")
				.data(shown, (d) => d.n.id)
				.join("text")
				.attr("x", (d) => d.n.x + radius(d.n) + 3 * f)
				.attr("y", (d) => d.n.y + 4 * f)
				.text((d) => d.t)
				.attr("font-size", 12 * f)
				.attr("fill", "var(--ink)")
				.attr("stroke", "var(--surface)")
				.attr("stroke-width", 3 * f)
				.attr("paint-order", "stroke")
				.style("pointer-events", "none");
		}
		const clip = (s, n) => (s.length > n ? `${s.slice(0, n - 1)}…` : s);
		function tip(ev, n) {
			const t = $("tip"),
				box = $("canvas").getBoundingClientRect();
			t.innerHTML = `<strong>${esc(n.label)}</strong><br><span class="num">言及 ${n.m} · 文書 ${n.docs.length}</span>`;
			t.hidden = false;
			const x = Math.min(ev.clientX - box.left + 12, box.width - 270),
				y = Math.max(ev.clientY - box.top - 40, 8);
			t.style.left = `${x}px`;
			t.style.top = `${y}px`;
		}
		function emphasize() {
			const near = new Set();
			if (selected) {
				near.add(selected);
				for (const e of current.edges) {
					if (e.s === selected) near.add(e.t);
					if (e.t === selected) near.add(e.s);
				}
			}
			const q = $("q").value.trim().toLowerCase();
			const hit = (n) => q && n.names.some((x) => x.toLowerCase().includes(q));
			gNodes
				.selectAll("circle")
				.attr("opacity", (n) =>
					selected ? (near.has(n.id) ? 1 : 0.18) : q ? (hit(n) ? 1 : 0.25) : 1,
				)
				.attr("stroke", (n) =>
					n.id === selected || hit(n) ? "var(--ink)" : "var(--surface)",
				);
			gEdges
				.selectAll("line")
				.attr("opacity", (e) =>
					selected
						? e.s === selected || e.t === selected
							? 1
							: 0.08
						: q
							? 0.3
							: 0.9,
				);
			gLabels
				.selectAll("text")
				.attr("opacity", (d) => (selected ? (near.has(d.n.id) ? 1 : 0.2) : 1));
		}
		function select(id) {
			selected = id;
			inspect(id ? byId.get(id) : null);
			// The layout is kept unless the chosen node is not drawn (a search can pick a filtered-out node).
			if (id && !current.nodes.some((n) => n.id === id)) draw();
			else {
				labels();
				emphasize();
			}
		}
		function inspect(n) {
			const el = $("inspector");
			if (!n) {
				el.innerHTML = `<p class="empty">ノードを選ぶと、名前の表記・種類・現れる文書・関係をここに出します。</p><p class="empty">ノード 1 つは、モデルが「同じ実体」と判断した言及のまとまりです。判断が食い違った組（same と different）はつないでいません。</p>`;
				return;
			}
			const out = D.edges
				.filter((e) => e.s === n.id || e.t === n.id)
				.sort((a, b) => b.m - a.m);
			const rel = out
				.map((e) => {
					const other = byId.get(e.s === n.id ? e.t : e.s);
					const arrow =
						e.s === e.t ? "↺" : !e.dir ? "—" : e.s === n.id ? "→" : "←";
					const q = [
						e.neg ? "否定" : null,
						e.cert !== "stated"
							? e.cert === "uncertain"
								? "不確か"
								: "仮定"
							: null,
					]
						.filter(Boolean)
						.join("・");
					const end =
						e.s === e.t
							? `<span class="meta">同じノードの中</span>`
							: `<button type="button" data-id="${esc(other.id)}">${esc(other.label)}</button>`;
					return `<li><span>${arrow} <strong>${esc(e.rel)}</strong>${q ? `（${esc(q)}）` : ""} ${end}</span><span class="meta num">言及 ${e.m} · ${e.docs.map((d) => esc(docTitle(d))).join(" / ")}</span></li>`;
				})
				.join("");
			el.innerHTML = `
			<div><span class="label">ノード</span><h3 style="font-size:17px">${esc(n.label)}</h3><span class="num label">言及 ${n.m} · 文書 ${n.docs.length}</span></div>
			<div><span class="label">書かれた名前</span><div class="chips">${n.names.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div></div>
			<div><span class="label">抽出時の種類</span><div class="chips">${n.types.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div></div>
			<div><span class="label">現れる文書</span><div>${n.docs.map((d) => esc(docTitle(d))).join("<br>")}</div></div>
			${n.summary ? `<div><span class="label">要約（モデルが作った派生データ。根拠ではない）</span><p class="summary">${esc(n.summary)}</p></div>` : ""}
			<div><span class="label">関係 ${out.length} 件</span>${out.length ? `<ul class="rel">${rel}</ul>` : `<p class="empty">関係はありません。</p>`}</div>
			<button type="button" id="clear" class="chip" style="justify-self:start;cursor:pointer;background:none">選択を外す</button>`;
			el.querySelectorAll("button[data-id]").forEach((b) =>
				b.addEventListener("click", () => select(b.dataset.id)),
			);
			$("clear").addEventListener("click", () => select(null));
		}
		["minm", "doc", "cross", "iso"].forEach((id) =>
			$(id).addEventListener("change", draw),
		);
		$("q").addEventListener("input", emphasize);
		$("q").addEventListener("keydown", (ev) => {
			if (ev.key !== "Enter") return;
			const q = $("q").value.trim().toLowerCase();
			const hit = D.nodes
				.filter((n) => n.names.some((x) => x.toLowerCase().includes(q)))
				.sort((a, b) => b.m - a.m)[0];
			if (hit) {
				$("minm").value = "1";
				select(hit.id);
			}
		});
		let resizeTimer;
		window.addEventListener("resize", () => {
			clearTimeout(resizeTimer);
			resizeTimer = setTimeout(draw, 200);
		});
		inspect(null);
		draw();

		// --- evaluation -----------------------------------------------------------
		const ev = D.evaluation;
		const s = ev.summary;
		$("evalnote").innerHTML =
			`正解表は、素材を書いた側が先に決めた実体 ${s.entitiesInCorpus} 件と関係 ${D.evaluation.relations.length} 件です。ノードの名前のどれかが別名と一致すれば「見つかった」とします。実体の再現 <strong class="num">${pct(s.entityRecall)}</strong>、複数の文書に出る実体 ${s.crossDocumentEntities} 件のうち 1 つのノードにまとまったもの <strong class="num">${s.mergedIntoOneNode}</strong> 件、関係の再現 <strong class="num">${pct(s.relationRecall)}</strong>、混ぜてはいけない組を混ぜたもの <strong class="num">${s.distinctViolations}</strong> 件${s.impureNodes === undefined ? "" : `、正解表の 2 つ以上の実体を含むノード <strong class="num">${s.impureNodes}</strong> 件`}${r.largestSameComponent === null ? "" : `。same のリンクだけで（矛盾の規則なしに）つなぐと、最大のまとまりは言及 <strong class="num">${fmt(r.largestSameComponent)}</strong> 件`}。`;
		const mark = (b) =>
			b ? `<span class="ok">✓ あり</span>` : `<span class="ng">✕ なし</span>`;
		$("t-ent").innerHTML =
			`<thead><tr><th>実体</th><th class="n">出る文書</th><th>ノード</th><th class="n">分かれた数</th><th class="n">1 ノードの被覆</th></tr></thead><tbody>${ev.entities
				.filter((e) => e.expectedDocuments > 0)
				.map(
					(e) =>
						`<tr><td>${esc(e.id)}${e.labels.length ? `<br><span class="label">${esc(e.labels.slice(0, 3).join(" / "))}</span>` : ""}</td><td class="n">${e.expectedDocuments}</td><td>${mark(e.found)}</td><td class="n">${e.nodes}</td><td class="n">${pct(e.bestNodeCoverage)}</td></tr>`,
				)
				.join("")}</tbody>`;
		$("t-rel").innerHTML =
			`<thead><tr><th>つながるべき関係</th><th>辺</th><th>取り出された関係名</th></tr></thead><tbody>${ev.relations.map((x) => `<tr><td>${esc(x.about)}</td><td>${x.hit ? mark(true) : x.endpointsFound ? `<span class="ng">✕ 端点はある</span>` : mark(false)}</td><td>${esc(x.relations.slice(0, 3).join(" / "))}</td></tr>`).join("")}</tbody>`;

		// --- node table (the table view of the graph) -----------------------------
		const top = [...D.nodes]
			.sort((a, b) => b.m - a.m || b.docs.length - a.docs.length)
			.slice(0, 60);
		$("t-nodes").innerHTML =
			`<thead><tr><th>ノード</th><th class="n">言及</th><th class="n">文書</th><th class="n">関係</th><th class="n">名前の数</th><th>種類</th></tr></thead><tbody>${top.map((n) => `<tr><td>${esc(n.label)}</td><td class="n">${n.m}</td><td class="n">${n.docs.length}</td><td class="n">${D.edges.filter((e) => e.s === n.id || e.t === n.id).length}</td><td class="n">${n.names.length}</td><td>${esc(n.types.slice(0, 2).join(" / "))}</td></tr>`).join("")}</tbody>`;
	})();
</script>
