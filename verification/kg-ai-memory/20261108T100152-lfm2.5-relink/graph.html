状態に付けるキー","状態を表すキー","Platformの要素"],"m":5,"docs":[0,1,3],"summary":"state key とは、mem0 が Platform に付与するキーであり、Platform はこのキーを用いて古い状態を終わらせる。mem0 は Platform に state key を足し、同じ key（鍵）を持つ新しい状態が到来したとき、続いている状態（既存の状態）の終了時刻が自動で入力される仕組みとなっている。Platform の時間推論においても、続いている状態にこの key が付けられる。state key は、mem0 による施策4で Platform に足された要素でもある。"},{"id":"n14","label":"memory-benchmarks","names":["memory-benchmarks"],"types":["評価の枠組み","ベンチマーク","ツール・リソース"],"m":5,"docs":[1,2],"summary":"memory-benchmarks（別名なし）は、mem0 に関する公開されている評価（ベンチマーク）の枠組みを指す。複数の説明が存在し、内容が食い違っている。1 つの説明では、これは一般の「公開されている評価の枠組み」であり、既定の回答・採点モデルが gpt-4o であるとされる。一方、他の説明では、これは mem0 に関するベンチマークであるとされ、mem0 が提供するもの、mem0 の評価に用いられる公開された枠組み、mem0 の評価の枠組みを提供するリポジトリ、mem0 が提供するベンチマーク（自前の mem0 OSS と並べるために使う）とされる。Apache-2.0 ライセンスであるとする説明もある。ただし、実際に動かした再現が確かめていないことが挙げられている。"},{"id":"n15","label":"公開ベンチマーク","names":["公開ベンチマーク"],"types":["評価手法","mem0 の評価に用いられる物差し","追加する設計（優先順3）","物（評価手段）"],"m":5,"docs":[0,2],"summary":"公開ベンチマークとは、mem0 が行う評価（自社の測定による）に用いられるベンチマークである。mem0 の数値評価に用いられる。mem0 と同じ回答モデルで並べて測定することが望まれる。一方、eumenes_memory では公開ベンチマークはない。E4の評価では、公開ベンチマークでは測られていないとされている。使う費用の上限と回答・採点のモデルも判断対象である。"},{"id":"n16","label":"忘却","names":["忘却"],"types":["不可逆の操作","機能・プロセス","記憶システムの特徴","操作・処理","処理・操作"],"m":5,"docs":[0,1],"summary":"忘却は、Eumenesシステムにおける記憶の削除を担う機能である。訂正と忘却の語彙が持つ不可逆の忘却で、停止と名前で区別されている。2相で構成される。弱点は、台帳の速さではなく、想起の入力の量の弱さが挙げられる。利用者が消してほしいと言われたときに行う必要のある操作で、アプリケーションが明示に操作する必要がある。新では訂正と忘却の設計がアプリケーションの責任になる。"},{"id":"n17","label":"新方式","names":["新方式"],"types":["書込み方式","記憶管理の新方式","記憶管理の方式","記憶の保存方式"],"m":5,"docs":[0,1],"summary":null},{"id":"n18","label":"移行文書","names":["移行文書"],"types":["文書","文書の種類","検証に用いた資料"],"m":5,"docs":[1,3],"summary":"『移行文書』は、mem0 側が事実の根拠として用いた資料である。API の変更が書かれており、確かな根拠として扱われる。OSS v2 から v3 への破壊的変更を列挙する文書であり、移行に関する文書である。変更の確認出典として言及されている。変更の意味を記述している文書である。"},{"id":"n19","label":"mem0 OSS","names":["mem0 OSS"],"types":["オープンソース版mem0","製品・システム","測定対象・物","オープンソースソフトウェア","物（モデル）"],"m":5,"docs":[2],"summary":null},{"id":"n20","label":"合成データ","names":["合成データ","合成データの独自の評価"],"types":["評価データ","eumenes_memory の評価に用いられる物差し","評価に使用されるデータ","評価の側が使用するデータ"],"m":4,"docs":[0,2,3],"summary":null},{"id":"n21","label":"BEAM","names":["BEAM"],"types":["評価・分類の名称","ベンチマーク","分類（記憶システムの評価分類）","評価手法・指標"],"m":4,"docs":[1,2],"summary":"BEAMは、記憶における矛盾の解決を測る対象として挙げられている。mem0の矛盾の解決が属する分類であり、これは記憶の解決度が35.7とされる最も弱い分類である。矛盾の解決の値は、35.7（1M token）と32.5（10M token）で、公開された分類の中で最も低い値となった。BEAMは100万token・1,000万tokenの会話を使うベンチマークであり、小さなベンチマークが方法で点が上がるため、重視すべき対象として挙げられている。"},{"id":"n22","label":"State","names":["State"],"types":["記憶のカテゴリ","データ構造","状態","状態・区分"],"m":4,"docs":[0,2],"summary":null},{"id":"n23","label":"journal","names":["journal"],"types":["忘却の依存閉包と併置される仕組み","データ構造・記憶媒体","要素","設計要素"],"m":4,"docs":[0,2],"summary":"journal（日本語で「日記」、英語で「ジャーナル」）は、eumenes_memory が持つコードで決められる契約の一つで、忘却の依存閉包とセットで言及される。ホストが忘却内容を追記する記憶媒体である。鍵なしのハッシュの鎖によって構成され、偶然の破損だけを検出する。悪意ある書換えを防ぐのはホストの責任とされる。"},{"id":"n24","label":"出典","names":["出典"],"types":["出典・派生物","参照元文献または資料","データ","概念 / メタデータ"],"m":4,"docs":[0,2],"summary":null},{"id":"n25","label":"利用者","names":["利用者"],"types":["ユーザー","人物","人物（判断を行う主体）"],"m":4,"docs":[1,2],"summary":"「利用者」は、記憶の消し方をアプリケーション側で決める主体である。それは違うと発言したり、忘れてと発言したりする。記憶に関する決定（mem0への反映と実データの利用開始）を決定する人物でもある。未決の判断を決める主体であり、推奨は利用者に添えられるだけである。関係の出力を使っていた人々であり、mem0の後退を感じたとされる。"},{"id":"n26","label":"削除","names":["削除"],"types":["mem0 が残す課題","記憶の削除処理（DELETE）","記憶の削除処理","課題"],"m":4,"docs":[0,1],"summary":"削除とは、mem0 が「State of AI Agent Memory 2026」で残る課題として挙げているものの一つである。eumenes_memory はこの部分を厚く作った。旧方式では LLM が選んでいた処理の一つであった一方、新方式では実行されない処理でもある。"},{"id":"n27","label":"型付きの関係","names":["型付きの関係"],"types":["グラフの辺","グラフ記憶が付けない関係","関係の形式","mem0が手放した要素"],"m":4,"docs":[1,3],"summary":"「型付きの関係」は、mem0 のアーキテクチャ転換により、OSS の応答からも Platform の応答からも消えた。グラフ記憶は型付きの関係を付けない。Platform のグラフ記憶が返さない関係の形式である。mem0 が手放したものの1つであり、eumenes_memoryでは強み、あるいは別のパッケージの領分とされる。"},{"id":"n28","label":"実体","names":["実体"],"types":["取り出しの要素","採点対象","検索の要素","エンティティ"],"m":4,"docs":[0,1],"summary":null},{"id":"n29","label":"書込み","names":["書込み","2段の書込み","ADD-only の書込み"],"types":["記憶への書き込み処理","記憶の書込み処理","記憶の書込み方式","mem0 の変更・手法"],"m":4,"docs":[1,2],"summary":"書込み（2段の書込み、ADD-only の書込みとも呼ばれる）は、mem0 の記憶機能の構成要素の一つである。抽出と更新の2段で行われる処理である。mem0 の旧方式として言及される書込み方式である。mem0 の変更の一つとして言及されるが、矛盾が溜まり、今の事実を選ぶ仕事が回答するモデルに移るため取り入れない。"},{"id":"n30","label":"CAS","names":["CAS"],"types":["書込みの競合検出方式","コードが決定する事項","競合検出を行う書込み方式","誤った削除を抑制する仕組み"],"m":4,"docs":[0],"summary":null},{"id":"n31","label":"Mem0g","names":["Mem0g"],"types":["Mem0のグラフ版","Mem0 の旧バージョンの型付き関係を持つ構成要素","Mem0 の一種","Mem0の方式・バージョン"],"m":4,"docs":[1],"summary":null},{"id":"n32","label":"Neo4j","names":["Neo4j"],"types":["グラフデータベース","グラフデータベースのdriver","データベース"],"m":4,"docs":[1],"summary":null},{"id":"n33","label":"Python v2.0.0","names":["Python v2.0.0"],"types":["SDKのバージョン","Python SDK の版","ソフトウェアのバージョン","mem0 Python のリリースノート"],"m":4,"docs":[1],"summary":null},{"id":"n34","label":"1,001 件","names":["1,001 件","合成の 1,001 件"],"types":["合成データの件数","数量・上限"],"m":3,"docs":[0,2,3],"summary":"「1,001 件」（別名：合成の 1,001 件）は、検証で用いられた合成の記憶の件数であり、E2 で自然文の想起に使用された合成データの件数である。一方で、評価の側からは、全件を渡す方式では合成の 1,001 件では上限を超えると指摘されている。"},{"id":"n35","label":"BM25","names":["BM25"],"types":["取り出しの手法","キーワード検索の手法","検索方式"],"m":3,"docs":[0,1],"summary":"BM25とは、mem0の取り出し（検索）で意味・実体と融合される手法の一つである。キーワードの採点に用いられる手法であり、順位の加点にとどまり、候補を増やさない。"},{"id":"n36","label":"LoCoMo","names":["LoCoMo"],"types":["公開ベンチマーク","ベンチマーク","評価手法・ベンチマーク"],"m":3,"docs":[0,1],"summary":"LoCoMoは、公開ベンチマークの一つであり、小さなベンチマークの一例である。mem0は、LoCoMoでは、取得を広げる・文脈を長くする・強いモデルを使うといった方法で点が上がると注意している。LoCoMoのスコアについては、説明どうしの食い違いがある。ブログの表では71.4、時間推論の記事では86.1や91.6、2025年の論文では66.88と、値が異なる。"},{"id":"n37","label":"README","names":["README","README.md"],"types":["文書","ドキュメントファイル","説明文档"],"m":3,"docs":[0,2],"summary":"README（README.mdとも表記される）は、eumenes_memory の設計と状態を確認するために読み込まれたファイルである。会話履歴から抽出した50件のSeedとStateの候補28件を案内している。Seedの説明を含む文档であり、合成の件数に合わせて修正する。"},{"id":"n38","label":"byte 範囲","names":["byte 範囲","UTF-8 の byte 範囲"],"types":["コードが決定する事項","文字エンコーディングに基づく範囲指定","出典の情報"],"m":3,"docs":[0,2],"summary":"「byte 範囲」および「UTF-8 の byte 範囲」とは、UTF-8 におけるバイト範囲を指す。これは State が持つ情報の一つであり、出典の参照とセットで保持される。また、knowledge の根拠の一つとしても用いられる。"},{"id":"n39","label":"commit","names":["commit"],"types":["バージョン管理の単位","バージョン管理の変更単位"],"m":3,"docs":[0,2],"summary":"「commit」について、複数の説明が与えられている。これらの説明は、配布物（tgz）とcommitの関係について述べている。説明1では、「どの tgz がどの commit から作られたかを版番号だけでは追えない」とされる。説明2では、「配布物はcleanなcommitからだけ作る」とされる。説明3では、「clean な commit からの配布と、verify:package で一致が確認される単位」とされる。これらはすべて、commitから配布物（tgz）が作られる際、cleanなcommitから作られること、また版番号だけではどのtgzがどのcommitから作られたかを追えないことを示している。"},{"id":"n40","label":"eumenes_memory","names":["eumenes_memory"],"types":["知識・記憶システム","記憶システムの名称","システムや手法の名前"],"m":3,"docs":[2,3],"summary":null},{"id":"n41","label":"mem0 のアーキテクチャ転換が何をもたらすか","names":["mem0 のアーキテクチャ転換が何をもたらすか"],"types":["調査記事（Claude のアーティファクト）","Claude のアーティファクト（Web ページ）","文書（リンク）"],"m":3,"docs":[0,3],"summary":null},{"id":"n42","label":"verify:package","names":["verify:package"],"types":["検証コマンド","CIの試験コマンド"],"m":3,"docs":[0,2],"summary":"verify:package は、CI で実行される試験コマンドの一つである。manifest の commit と配布物が一致することを確かめるために使われる。具体的には、manifest の commit と一致するかどうかを検証するものとして機能する。"},{"id":"n43","label":"ベンチマークの数値","names":["ベンチマークの数値"],"types":["指標","mem0 の性能評価の数値"],"m":3,"docs":[1,3],"summary":"「ベンチマークの数値」とは、mem0 が自社の Platform で測定したベンチマークの結果の数値である。ページによって値が食い違い、回答と採点に使ったモデルも書かれていない。この数値は方向の目安としてだけ用いられ、事実の確定には用いない。"},{"id":"n44","label":"外部のグラフ DB","names":["外部のグラフ DB","グラフ DB"],"types":["外部データベース","グラフデータベース","データベース"],"m":3,"docs":[1,2],"summary":null},{"id":"n45","label":"時間","names":["時間"],"types":["記憶のカテゴリ","概念","概念・軸"],"m":3,"docs":[0,1],"summary":"「時間」は、精度つきの成立期間を保存するカテゴリである。今有効かどうかはホストが判定する。mem0 のアーキテクチャ転換により、Platform だけに扱われるようになる。旧来の仕様には時間推論と減衰はなく、新仕様では Platform だけに時間推論と減衰がある。"},{"id":"n46","label":"版","names":["版"],"types":["コードが決定する事項","eumenes_memory が持つもの","出典の情報"],"m":3,"docs":[0,2],"summary":"「版」について、複数の説明が与えられている。1つは、語句で分岐する処理は足さないと明記されており、コードが決定する事項の一つであるとする説明である。もう1つは、eumenes_memory が持っているものの一つであるとする説明である。さらに、knowledge の根拠の一つであり、版（バージョン）であるとする説明である。これらはすべて「版」の言及として取り出された。"},{"id":"n47","label":"知識の更新","names":["知識の更新"],"types":["概念・処理","概念・タスク","機能"],"m":3,"docs":[1,2],"summary":"知識の更新（mem0）は、mem0 自身が加算型の構造においていちばん難しい分類だと認めている分類である。mem0 が加算型の構造にとっていちばん難しい分類のままとした結果、LongMemEval では 96.2 から 93.6 に下がった。知識の更新は、mem0 の最も弱い分類に属する機能の一つである。"},{"id":"n48","label":"約 7,000 token","names":["約 7,000 token","7,000 token","約7,000 token"],"types":["mem0 の取り出し量","mem0 が 1 回で答えるトークン数","取り出しの収容量"],"m":3,"docs":[0,2],"summary":"「約7,000 token」（表記：約 7,000 token、7,000 token、約7,000 token）は、mem0 が取り出しを1回に行う際のトークン数である。mem0 の取り出しは1回あたり約7,000 token を収める。一方、eumenes_memory は全件を送るため、記憶が増えるほど不利になる。"},{"id":"n49","label":"索引","names":["索引"],"types":["実体の索引","全文検索用のデータ構造","物（システム要素）"],"m":3,"docs":[1,2],"summary":null},{"id":"n50","label":"配布の管理","names":["配布の管理","5. 配布の管理を正す（E5）","施策 5 配布の管理"],"types":["追加する設計（優先順4）","配布管理の施策","判断事項"],"m":3,"docs":[2,3],"summary":"配布の管理（E5：施策 5 配布の管理）は、配布物を正すための施策である。配布物を作る際は、足すものの優先順位4に従い、中身が変わるたびに版番号を上げ、cleanなcommitからだけ配布物を作ることとされる。なお、mem0側では関係ないとされ、評価の側では同じ版番号で中身の違うtgzがあるとされる。"},{"id":"n51","label":"2025 年の論文","names":["2025 年の論文"],"types":["学術論文","論文"],"m":3,"docs":[1],"summary":null},{"id":"n52","label":"mem0 のブログ","names":["mem0 のブログ"],"types":["ブログ","根拠となる資料"],"m":3,"docs":[1],"summary":null},{"id":"n53","label":"mem0/memory/main.py","names":["mem0/memory/main.py","main.py"],"types":["ソースコードのファイルパス","ソースコードのファイル","mem0 のコード（main 枝）"],"m":3,"docs":[1],"summary":null},{"id":"n54","label":"steward","names":["steward","Eumenes の steward"],"types":["Eumenes 側の構成要素","意味の判断を持つ主体","LLM の step"],"m":3,"docs":[0],"summary":null},{"id":"n55","label":"アプリケーション","names":["アプリケーション"],"types":["ソフトウェア"],"m":3,"docs":[1],"summary":null},{"id":"n56","label":"ホスト","names":["ホスト"],"types":["記憶の有効性を判定する主体","構成要素・主体","主体"],"m":3,"docs":[0],"summary":null},{"id":"n57","label":"利用者の発言","nam <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
	(() => {
		const D = JSON.parse(document.getElementById("kg-data").textContent);
		const $ = (id) => document.getElementById(id);
		const esc = (s) =>
			String(s).replace(
				/[&<>"']/g,
				(c) =>
					({
						"&": "&amp;",
						"<": "&lt;",
						">": "&gt;",
						'"': "&quot;",
						"'": "&#39;",
					})[c],
			);
		const fmt = (n) => Number(n).toLocaleString("ja-JP");
		const pct = (x) =>
			x === null || x === undefined ? "—" : `${Math.round(x * 100)}%`;
		const docTitle = (i) => D.documents[i]?.title ?? "?";
		// Relation names are free text, so the API's edges (one per node pair, direction, relation name,
		// negation and certainty) rarely repeat. The picture draws one line per node pair instead and
		// lists the relations themselves in the inspector. Relations inside one node are not drawn.
		const pairs = new Map();
		for (const e of D.edges) {
			if (e.s === e.t) continue;
			const [a, b] = e.s < e.t ? [e.s, e.t] : [e.t, e.s];
			const key = `${a}|${b}`;
			let p = pairs.get(key);
			if (!p)
				pairs.set(key, (p = { id: key, s: a, t: b, m: 0, docs: new Set() }));
			p.m += e.m;
			for (const d of e.docs) p.docs.add(d);
		}
		const P = [...pairs.values()].map((p) => ({ ...p, docs: [...p.docs] }));

		// --- header ---------------------------------------------------------------
		const r = D.run;
		const how = r.relinked
			? `前の実行の抽出をそのまま使い、同一視だけを ${r.llm}（LARM の profile ${r.profile}、同一視の指示 v${r.linkVersion}）でやり直して`
			: `${r.llm}（LARM の profile ${r.profile}）で取り込み`;
		$("lede").textContent =
			`合成の調査 ${D.documents.length} 文書を、${how}、eumenes_knowledge のグラフ API から取り出したもの。手で描いた図ではなく、抽出と同一視の結果そのものです。${r.date} の 1 回の実行で、品質の基準値ではありません。`;
		const facts = [
			["文書", fmt(D.documents.length), `${fmt(r.bytes)} bytes`],
			["断片", fmt(r.fragments), `抽出の失敗 ${fmt(r.extractionsFailed)}`],
			["言及", fmt(r.entityMentions), `関係 ${fmt(r.relationMentions)}`],
			[
				"同一視の判断",
				fmt(r.linksSame + r.linksDifferent + r.linksUnsure),
				`same ${fmt(r.linksSame)} · different ${fmt(r.linksDifferent)} · unsure ${fmt(r.linksUnsure)}`,
			],
			[
				"ノード",
				fmt(D.nodes.length),
				`文書をまたぐもの ${fmt(D.nodes.filter((n) => n.docs.length > 1).length)}`,
			],
			[
				"関係",
				fmt(D.edges.length),
				`ノードの組 ${fmt(P.length)} · 2 文書以上で出る組 ${fmt(P.filter((p) => p.docs.length > 1).length)}`,
			],
			[
				"根拠の確認",
				`${fmt(r.evidenceValid)}/${fmt(r.evidenceTotal)}`,
				"根拠 API で valid",
			],
			["実行時間", `${r.minutes} 分`, `モデル呼出し ${fmt(r.calls)} 回`],
		];
		$("facts").innerHTML = facts
			.map(
				([k, v, s]) =>
					`<div class="fact"><span class="label">${esc(k)}</span><span class="value">${esc(v)}</span><span class="sub">${esc(s)}</span></div>`,
			)
			.join("");
		const reasonText = {
			linking_conflict: "矛盾する same を使わなかった",
			linking_unsure: "モデルが判断できなかった組がある",
			linking_pending: "同一視が終わっていない文書がある",
			extraction_incomplete: "抽出に失敗した断片がある",
			nodes_truncated: "ノードを上限で切った",
			edges_truncated: "辺を上限で切った",
		};
		$("reasons").innerHTML = D.partialReasons
			.map(
				(p) =>
					`<span class="reason">${esc(reasonText[p] ?? p)} <code>${esc(p)}</code></span>`,
			)
			.join("");

		// --- graph ----------------------------------------------------------------
		const svg = d3.select("#svg");
		const root = svg.append("g");
		const gEdges = root.append("g");
		const gNodes = root.append("g");
		const gLabels = root.append("g");
		const zoom = d3
			.zoom()
			.scaleExtent([0.2, 6])
			.on("zoom", (ev) => root.attr("transform", ev.transform));
		svg.call(zoom);
		const ramp = ["--d1", "--d2", "--d3", "--d4"];
		const fill = (n) => `var(${ramp[Math.min(n.docs.length, 4) - 1]})`;
		const radius = (n) => 3.5 + Math.sqrt(n.m) * 2.4;
		$("legend").innerHTML =
			"現れる文書の数 " +
			[1, 2, 3, 4]
				.map(
					(k) =>
						`<span><span class="swatch" style="background:var(${ramp[k - 1]})"></span>${k}</span>`,
				)
				.join("") +
			` <span>· 大きさ＝言及の数 · 線＝関係のあるノードの組（太さ＝関係の言及数、濃い線＝2 文書以上で出る組）</span>`;
		D.documents.forEach((d, i) => {
			const o = document.createElement("option");
			o.value = String(i);
			o.textContent = d.title;
			$("doc").append(o);
		});

		const byId = new Map(D.nodes.map((n) => [n.id, n]));
		let selected = null;
		let current = { nodes: [], edges: [] };
		let fitK = 1;

		function filtered() {
			const minm = Number($("minm").value);
			const doc = $("doc").value === "" ? null : Number($("doc").value);
			const cross = $("cross").checked;
			let nodes = D.nodes.filter(
				(n) =>
					n.m >= minm &&
					(!cross || n.docs.length > 1) &&
					(doc === null || n.docs.includes(doc)),
			);
			const keep = new Set(nodes.map((n) => n.id));
			const edges = P.filter(
				(e) =>
					keep.has(e.s) &&
					keep.has(e.t) &&
					(doc === null || e.docs.includes(doc)),
			);
			if ($("iso").checked) {
				const linked = new Set(edges.flatMap((e) => [e.s, e.t]));
				nodes = nodes.filter((n) => linked.has(n.id) || n.id === selected);
			}
			return { nodes, edges };
		}

		function draw() {
			const { nodes, edges } = filtered();
			const box = $("canvas").getBoundingClientRect();
			const w = Math.max(box.width, 320),
				h = Math.max(box.height, 320);
			const simNodes = nodes.map((n) => ({ ...n }));
			const simIndex = new Map(simNodes.map((n) => [n.id, n]));
			const simEdges = edges.map((e) => ({
				...e,
				source: simIndex.get(e.s),
				target: simIndex.get(e.t),
			}));
			const sim = d3
				.forceSimulation(simNodes)
				.force("link", d3.forceLink(simEdges).distance(95).strength(0.25))
				.force("charge", d3.forceManyBody().strength(-260).distanceMax(600))
				.force(
					"collide",
					d3.forceCollide().radius((n) => radius(n) + 8),
				)
				.force("x", d3.forceX(0).strength(0.04))
				.force("y", d3.forceY(0).strength(0.06))
				.stop();
			// Settled before the first frame: the page is complete at rest, no animation.
			for (let i = 0; i < 400; i++) sim.tick();
			current = { nodes: simNodes, edges: simEdges };
			$("shown").textContent =
				`表示 ${fmt(simNodes.length)} ノード · ${fmt(simEdges.length)} 組`;

			gEdges
				.selectAll("line")
				.data(simEdges, (e) => e.id)
				.join("line")
				.attr("x1", (e) => e.source.x)
				.attr("y1", (e) => e.source.y)
				.attr("x2", (e) => e.target.x)
				.attr("y2", (e) => e.target.y)
				.attr("stroke", (e) =>
					e.docs.length > 1 ? "var(--edge-cross)" : "var(--edge)",
				)
				.attr("stroke-width", (e) => 1 + Math.log2(e.m));
			gNodes
				.selectAll("circle")
				.data(simNodes, (n) => n.id)
				.join("circle")
				.attr("cx", (n) => n.x)
				.attr("cy", (n) => n.y)
				.attr("r", radius)
				.attr("fill", fill)
				.attr("stroke", "var(--surface)")
				.attr("stroke-width", 2)
				.attr("tabindex", 0)
				.attr("role", "button")
				.attr(
					"aria-label",
					(n) => `${n.label}、言及 ${n.m}、文書 ${n.docs.length}`,
				)
				.style("cursor", "pointer")
				.on("click", (ev, n) => select(n.id))
				.on("keydown", (ev, n) => {
					if (ev.key === "Enter" || ev.key === " ") {
						ev.preventDefault();
						select(n.id);
					}
				})
				.on("mouseenter", (ev, n) => tip(ev, n))
				.on("mousemove", (ev, n) => tip(ev, n))
				.on("mouseleave", () => ($("tip").hidden = true));
			// Fit the settled layout into the canvas (the legend strip at the bottom stays clear).
			const xs = simNodes.map((n) => n.x),
				ys = simNodes.map((n) => n.y);
			if (simNodes.length) {
				const x0 = Math.min(...xs) - 20,
					x1 = Math.max(...xs) + 90,
					y0 = Math.min(...ys) - 20,
					y1 = Math.max(...ys) + 20;
				const k = Math.min(2, (w - 24) / (x1 - x0), (h - 70) / (y1 - y0));
				fitK = k;
				svg.call(
					zoom.transform,
					d3.zoomIdentity
						.translate(
							(w - (x1 - x0) * k) / 2 - x0 * k,
							(h - 50 - (y1 - y0) * k) / 2 - y0 * k,
						)
						.scale(k),
				);
			}
			labels();
			emphasize();
		}
		// Labels go to the nodes with the most mentions first, and a label that would overlap one already
		// placed is left out (its node still shows its name on hover and in the inspector).
		function labels() {
			const near = new Set(selected ? [selected] : []);
			if (selected)
				for (const e of current.edges) {
					if (e.s === selected) near.add(e.t);
					if (e.t === selected) near.add(e.s);
				}
			const order = [...current.nodes].sort(
				(a, b) =>
					near.has(b.id) - near.has(a.id) ||
					b.m - a.m ||
					b.docs.length - a.docs.length,
			);
			const placed = [];
			// Labels keep 12px on screen at the fitted zoom, so their boxes are measured at that scale.
			const f = 1 / fitK;
			const width = (t) =>
				[...t].reduce((s, c) => s + (c.charCodeAt(0) > 0x2e7f ? 12 : 7), 0) * f;
			const top = new Set(order.slice(0, 10).map((n) => n.id));
			const shown = [];
			for (const n of order) {
				if (!near.has(n.id) && shown.length >= 40) break;
				const t = clip(n.label, 20);
				const b = {
					x0: n.x + radius(n) + 2 * f,
					y0: n.y - 8 * f,
					x1: n.x + radius(n) + 4 * f + width(t),
					y1: n.y + 8 * f,
				};
				const hitsLabel = placed.some(
					(p) => b.x0 < p.x1 && p.x0 < b.x1 && b.y0 < p.y1 && p.y0 < b.y1,
				);
				// The ten nodes with the most mentions are labelled even over a neighbouring node.
				const hitsNode =
					!top.has(n.id) &&
					current.nodes.some(
						(o) =>
							o !== n &&
							o.x + radius(o) > b.x0 &&
							o.x - radius(o) < b.x1 &&
							o.y + radius(o) > b.y0 &&
							o.y - radius(o) < b.y1,
					);
				if (n.id !== selected && (hitsLabel || hitsNode)) continue;
				placed.push(b);
				shown.push({ n, t });
			}
			gLabels
				.selectAll("text")
				.data(shown, (d) => d.n.id)
				.join("text")
				.attr("x", (d) => d.n.x + radius(d.n) + 3 * f)
				.attr("y", (d) => d.n.y + 4 * f)
				.text((d) => d.t)
				.attr("font-size", 12 * f)
				.attr("fill", "var(--ink)")
				.attr("stroke", "var(--surface)")
				.attr("stroke-width", 3 * f)
				.attr("paint-order", "stroke")
				.style("pointer-events", "none");
		}
		const clip = (s, n) => (s.length > n ? `${s.slice(0, n - 1)}…` : s);
		function tip(ev, n) {
			const t = $("tip"),
				box = $("canvas").getBoundingClientRect();
			t.innerHTML = `<strong>${esc(n.label)}</strong><br><span class="num">言及 ${n.m} · 文書 ${n.docs.length}</span>`;
			t.hidden = false;
			const x = Math.min(ev.clientX - box.left + 12, box.width - 270),
				y = Math.max(ev.clientY - box.top - 40, 8);
			t.style.left = `${x}px`;
			t.style.top = `${y}px`;
		}
		function emphasize() {
			const near = new Set();
			if (selected) {
				near.add(selected);
				for (const e of current.edges) {
					if (e.s === selected) near.add(e.t);
					if (e.t === selected) near.add(e.s);
				}
			}
			const q = $("q").value.trim().toLowerCase();
			const hit = (n) => q && n.names.some((x) => x.toLowerCase().includes(q));
			gNodes
				.selectAll("circle")
				.attr("opacity", (n) =>
					selected ? (near.has(n.id) ? 1 : 0.18) : q ? (hit(n) ? 1 : 0.25) : 1,
				)
				.attr("stroke", (n) =>
					n.id === selected || hit(n) ? "var(--ink)" : "var(--surface)",
				);
			gEdges
				.selectAll("line")
				.attr("opacity", (e) =>
					selected
						? e.s === selected || e.t === selected
							? 1
							: 0.08
						: q
							? 0.3
							: 0.9,
				);
			gLabels
				.selectAll("text")
				.attr("opacity", (d) => (selected ? (near.has(d.n.id) ? 1 : 0.2) : 1));
		}
		function select(id) {
			selected = id;
			inspect(id ? byId.get(id) : null);
			// The layout is kept unless the chosen node is not drawn (a search can pick a filtered-out node).
			if (id && !current.nodes.some((n) => n.id === id)) draw();
			else {
				labels();
				emphasize();
			}
		}
		function inspect(n) {
			const el = $("inspector");
			if (!n) {
				el.innerHTML = `<p class="empty">ノードを選ぶと、名前の表記・種類・現れる文書・関係をここに出します。</p><p class="empty">ノード 1 つは、モデルが「同じ実体」と判断した言及のまとまりです。判断が食い違った組（same と different）はつないでいません。</p>`;
				return;
			}
			const out = D.edges
				.filter((e) => e.s === n.id || e.t === n.id)
				.sort((a, b) => b.m - a.m);
			const rel = out
				.map((e) => {
					const other = byId.get(e.s === n.id ? e.t : e.s);
					const arrow =
						e.s === e.t ? "↺" : !e.dir ? "—" : e.s === n.id ? "→" : "←";
					const q = [
						e.neg ? "否定" : null,
						e.cert !== "stated"
							? e.cert === "uncertain"
								? "不確か"
								: "仮定"
							: null,
					]
						.filter(Boolean)
						.join("・");
					const end =
						e.s === e.t
							? `<span class="meta">同じノードの中</span>`
							: `<button type="button" data-id="${esc(other.id)}">${esc(other.label)}</button>`;
					return `<li><span>${arrow} <strong>${esc(e.rel)}</strong>${q ? `（${esc(q)}）` : ""} ${end}</span><span class="meta num">言及 ${e.m} · ${e.docs.map((d) => esc(docTitle(d))).join(" / ")}</span></li>`;
				})
				.join("");
			el.innerHTML = `
			<div><span class="label">ノード</span><h3 style="font-size:17px">${esc(n.label)}</h3><span class="num label">言及 ${n.m} · 文書 ${n.docs.length}</span></div>
			<div><span class="label">書かれた名前</span><div class="chips">${n.names.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div></div>
			<div><span class="label">抽出時の種類</span><div class="chips">${n.types.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div></div>
			<div><span class="label">現れる文書</span><div>${n.docs.map((d) => esc(docTitle(d))).join("<br>")}</div></div>
			${n.summary ? `<div><span class="label">要約（モデルが作った派生データ。根拠ではない）</span><p class="summary">${esc(n.summary)}</p></div>` : ""}
			<div><span class="label">関係 ${out.length} 件</span>${out.length ? `<ul class="rel">${rel}</ul>` : `<p class="empty">関係はありません。</p>`}</div>
			<button type="button" id="clear" class="chip" style="justify-self:start;cursor:pointer;background:none">選択を外す</button>`;
			el.querySelectorAll("button[data-id]").forEach((b) =>
				b.addEventListener("click", () => select(b.dataset.id)),
			);
			$("clear").addEventListener("click", () => select(null));
		}
		["minm", "doc", "cross", "iso"].forEach((id) =>
			$(id).addEventListener("change", draw),
		);
		$("q").addEventListener("input", emphasize);
		$("q").addEventListener("keydown", (ev) => {
			if (ev.key !== "Enter") return;
			const q = $("q").value.trim().toLowerCase();
			const hit = D.nodes
				.filter((n) => n.names.some((x) => x.toLowerCase().includes(q)))
				.sort((a, b) => b.m - a.m)[0];
			if (hit) {
				$("minm").value = "1";
				select(hit.id);
			}
		});
		let resizeTimer;
		window.addEventListener("resize", () => {
			clearTimeout(resizeTimer);
			resizeTimer = setTimeout(draw, 200);
		});
		inspect(null);
		draw();

		// --- evaluation -----------------------------------------------------------
		const ev = D.evaluation;
		const s = ev.summary;
		$("evalnote").innerHTML =
			`正解表は、素材を書いた側が先に決めた実体 ${s.entitiesInCorpus} 件と関係 ${D.evaluation.relations.length} 件です。ノードの名前のどれかが別名と一致すれば「見つかった」とします。実体の再現 <strong class="num">${pct(s.entityRecall)}</strong>、複数の文書に出る実体 ${s.crossDocumentEntities} 件のうち 1 つのノードにまとまったもの <strong class="num">${s.mergedIntoOneNode}</strong> 件、関係の再現 <strong class="num">${pct(s.relationRecall)}</strong>、混ぜてはいけない組を混ぜたもの <strong class="num">${s.distinctViolations}</strong> 件${s.impureNodes === undefined ? "" : `、正解表の 2 つ以上の実体を含むノード <strong class="num">${s.impureNodes}</strong> 件`}${r.largestSameComponent === null ? "" : `。same のリンクだけで（矛盾の規則なしに）つなぐと、最大のまとまりは言及 <strong class="num">${fmt(r.largestSameComponent)}</strong> 件`}。`;
		const mark = (b) =>
			b ? `<span class="ok">✓ あり</span>` : `<span class="ng">✕ なし</span>`;
		$("t-ent").innerHTML =
			`<thead><tr><th>実体</th><th class="n">出る文書</th><th>ノード</th><th class="n">分かれた数</th><th class="n">1 ノードの被覆</th></tr></thead><tbody>${ev.entities
				.filter((e) => e.expectedDocuments > 0)
				.map(
					(e) =>
						`<tr><td>${esc(e.id)}${e.labels.length ? `<br><span class="label">${esc(e.labels.slice(0, 3).join(" / "))}</span>` : ""}</td><td class="n">${e.expectedDocuments}</td><td>${mark(e.found)}</td><td class="n">${e.nodes}</td><td class="n">${pct(e.bestNodeCoverage)}</td></tr>`,
				)
				.join("")}</tbody>`;
		$("t-rel").innerHTML =
			`<thead><tr><th>つながるべき関係</th><th>辺</th><th>取り出された関係名</th></tr></thead><tbody>${ev.relations.map((x) => `<tr><td>${esc(x.about)}</td><td>${x.hit ? mark(true) : x.endpointsFound ? `<span class="ng">✕ 端点はある</span>` : mark(false)}</td><td>${esc(x.relations.slice(0, 3).join(" / "))}</td></tr>`).join("")}</tbody>`;

		// --- node table (the table view of the graph) -----------------------------
		const top = [...D.nodes]
			.sort((a, b) => b.m - a.m || b.docs.length - a.docs.length)
			.slice(0, 60);
		$("t-nodes").innerHTML =
			`<thead><tr><th>ノード</th><th class="n">言及</th><th class="n">文書</th><th class="n">関係</th><th class="n">名前の数</th><th>種類</th></tr></thead><tbody>${top.map((n) => `<tr><td>${esc(n.label)}</td><td class="n">${n.m}</td><td class="n">${n.docs.length}</td><td class="n">${D.edges.filter((e) => e.s === n.id || e.t === n.id).length}</td><td class="n">${n.names.length}</td><td>${esc(n.types.slice(0, 2).join(" / "))}</td></tr>`).join("")}</tbody>`;
	})();
</script>
